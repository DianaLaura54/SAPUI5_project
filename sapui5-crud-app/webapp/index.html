<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Manager - SAPUI5 CRUD Demo</title>

    <!-- Bootstrapping SAPUI5 from the public CDN (no build step needed) -->
    <script
        id="sap-ui-bootstrap"
        src="https://sdk.openui5.org/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m,sap.ui.core,sap.ui.layout,sap.f"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-onInit="module:sap-ui-app/index"
        data-sap-ui-resourceroots='{
            "sap-ui-app": "./"
        }'>
    </script>
</head>
<body class="sapUiBody" id="content">
</body>
</html>
